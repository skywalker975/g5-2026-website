<!-- HERO Automatic Left Sidebar Index Generator & Active Section Tracker -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.querySelector(".hero-sidetoc-container");
    const article = document.querySelector("article#maincontent, article, main");
    if (!container || !article) return;

    // Extract all headings (h1, h2, h3, h4)
    const headings = Array.from(article.querySelectorAll("h1, h2, h3, h4")).filter(h => {
        const text = h.textContent.trim();
        return text.length > 0 && !h.closest(".hero-sidetoc-container") && !h.closest("aside");
    });

    if (!headings.length) return;

    let tocHTML = '<nav class="hero-sidetoc-nav" aria-label="Table of contents">';
    tocHTML += '<div class="hero-sidetoc-title">INDEX</div>';
    tocHTML += '<ul class="hero-toc-list">';

    headings.forEach((h, index) => {
        if (!h.id) {
            h.id = "section-" + index + "-" + h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        }
        
        let rawText = h.textContent.trim();
        // Remove font awesome icon tags text if present
        let cleanText = rawText.replace(/^[\s\S]*?\s{2,}/, "").trim();
        if (cleanText.length > 38) {
            cleanText = cleanText.substring(0, 35) + "...";
        }
        
        const isSub = (h.tagName === "H3" || h.tagName === "H4");
        const subClass = isSub ? 'class="hero-toc-subitem"' : '';
        
        tocHTML += `<li ${subClass}><a href="#${h.id}">${cleanText}</a></li>`;
    });

    tocHTML += '</ul>';
    tocHTML += `
    <div class="mt-3 pt-2 text-center px-1" style="border-top: 1px solid rgba(255,255,255,0.1);">
      <a href="http://epimelesi.isti.cnr.it:8080/" target="_blank" class="btn btn-sm w-100" style="background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; font-size: 0.72rem; font-weight: 700; border: none; border-radius: 6px; padding: 7px 8px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35); display: inline-flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.4px;">
        <i class="fas fa-desktop" style="font-size: 0.78rem;"></i>
        <span>Interactive UI</span>
      </a>
    </div>
    `;
    tocHTML += '</nav>';
    container.innerHTML = tocHTML;

    // IntersectionObserver Active Section Scroll Tracking
    const links = container.querySelectorAll("a");
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = "#" + entry.target.id;
                links.forEach(link => {
                    const parent = link.parentElement;
                    if (link.getAttribute("href") === id) {
                        link.classList.add("active");
                        if (parent) parent.classList.add("active");
                    } else {
                        link.classList.remove("active");
                        if (parent) parent.classList.remove("active");
                    }
                });
            }
        });
    }, { rootMargin: "-15% 0px -60% 0px" });

    headings.forEach(h => observer.observe(h));
});
</script>
