<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO Visualizer — Radar Stagionale Precipitazioni (4 Trimestri) — Afghanistan (AFG)</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="glass-card flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-indigo-400 text-sm font-semibold tracking-wider uppercase mb-1">
                    <i class="fa-solid fa-chart-line"></i> HERO Stand-Alone Interactive Chart
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Radar Stagionale Precipitazioni (4 Trimestri) — Afghanistan (AFG)</h1>
                <p class="text-slate-400 text-sm mt-1">Confronto stagionale su base trimestrale (Dati Aggregati Trend)</p>
            </div>
        </header>

        <div class="glass-card">
            <div id="chart-container" style="min-height: 400px;"></div>
        </div>
        
        
    </div>

    <script>
        const series = [{"name": "2022", "data": [31.9, 11.85, 4.95, 35.29]}, {"name": "2023", "data": [0, 12.9, 0, 23.27]}, {"name": "2024", "data": [82.29, 10.11, 6.38, 33.52]}, {"name": "2025", "data": [35.68, 7.83, 0, 0]}];
        const categories = ["Q1 (Gen-Mar)", "Q2 (Apr-Giu)", "Q3 (Lug-Set)", "Q4 (Ott-Dic)"];
        const colors = ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
        
        const options = {
            series: series,
            chart: {
                type: 'radar',
                height: 450,
                toolbar: { show: true },
                background: 'transparent'
            },
            colors: colors,
            stroke: {
                width: 2,
                curve: 'smooth'
            },
            fill: {
                type: 'solid',
                opacity: 0.25,
                gradient: {
                    shade: 'dark',
                    type: 'diagonal1',
                    shadeIntensity: 0.5,
                    opacityFrom: 0.45,
                    opacityTo: 0.05,
                    stops: [0, 100]
                }
            },
            markers: {
                size: 3,
                hover: { size: 6 }
            },
            xaxis: {
                categories: categories,
                labels: {
                    style: {
                        colors: '#94a3b8',
                        fontSize: '11px',
                        fontFamily: 'Inter',
                        fontWeight: 500
                    }
                }
            },
            yaxis: {
                title: { text: 'mm / Trimestre', style: { color: '#94a3b8' } },
                labels: {
                    style: { colors: '#64748b' }
                }
            },
            theme: { mode: 'dark' },
            tooltip: { shared: true, intersect: false },
            legend: { position: 'bottom', fontFamily: 'Inter', fontSize: '12px' }
        };
        
        const chart = new ApexCharts(document.querySelector("#chart-container"), options);
        chart.render();
    </script>
</body>
</html>
