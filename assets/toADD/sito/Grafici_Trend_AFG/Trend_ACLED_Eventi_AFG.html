<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO Visualizer — Trend Eventi di Conflitto (ACLED) — Afghanistan (AFG)</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="glass-card flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-indigo-400 text-sm font-semibold tracking-wider uppercase mb-1">
                    <i class="fa-solid fa-chart-line"></i> HERO Stand-Alone Interactive Chart
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Trend Eventi di Conflitto (ACLED) — Afghanistan (AFG)</h1>
                <p class="text-slate-400 text-sm mt-1">Numero di eventi violenti registrati</p>
            </div>
        </header>

        <div class="glass-card">
            <div id="chart-container" style="min-height: 400px;"></div>
        </div>
        
        
    </div>

    <script>
        const series = [{"name": "Eventi Conflitto", "data": [529.0, 4684.0, 227.0, 3520.0, 3752.0, 4939.0, 5180.0, 1390.0, 6229.0, 3282.0, 5660.0, 4070.0, 4281.0, 480.0, 1731.0, 1210.0, 1874.0, 621.0, 1007.0, 169.0, 895.0, 114.0, 645.0, 228.0, 919.0, 290.0, 702.0, 161.0, 681.0, 0.0, 0.0, 0.0]}];
        const categories = ["2017-05-01", "2017-08-01", "2017-11-01", "2018-08-01", "2018-11-01", "2019-08-01", "2019-11-01", "2020-04-01", "2020-06-01", "2020-08-01", "2020-11-01", "2021-03-01", "2021-06-01", "2021-09-01", "2021-11-01", "2022-03-01", "2022-06-01", "2022-09-01", "2022-11-01", "2023-04-01", "2023-05-01", "2023-10-01", "2023-11-01", "2024-03-01", "2024-05-01", "2024-09-01", "2024-11-01", "2025-03-01", "2025-05-01", "2025-09-01", "2025-11-01", "2026-04-01"];
        const colors = ["#ef4444"];
        
        const options = {
            series: series,
            chart: {
                type: 'bar',
                height: 450,
                toolbar: { show: true },
                background: 'transparent'
            },
            colors: colors,
            stroke: {
                width: 3,
                curve: 'smooth'
            },
            fill: {
                type: 'solid',
                opacity: 1,
                gradient: {
                    shade: 'dark',
                    type: 'diagonal1',
                    shadeIntensity: 0.5,
                    opacityFrom: 0.45,
                    opacityTo: 0.05,
                    stops: [0, 100]
                }
            },
            markers: {
                size: 3,
                hover: { size: 6 }
            },
            xaxis: {
                categories: categories,
                labels: {
                    style: {
                        colors: '#94a3b8',
                        fontSize: '11px',
                        fontFamily: 'Inter',
                        fontWeight: 500
                    }
                }
            },
            yaxis: {
                title: { text: 'Eventi / Mese', style: { color: '#94a3b8' } },
                labels: {
                    style: { colors: '#64748b' }
                }
            },
            theme: { mode: 'dark' },
            tooltip: { shared: true, intersect: false },
            legend: { position: 'bottom', fontFamily: 'Inter', fontSize: '12px' }
        };
        
        const chart = new ApexCharts(document.querySelector("#chart-container"), options);
        chart.render();
    </script>
</body>
</html>
