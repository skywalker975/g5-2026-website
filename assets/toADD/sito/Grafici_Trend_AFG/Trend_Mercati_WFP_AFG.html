<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO Visualizer — Trend Prezzi Alimentari WFP — Afghanistan (AFG)</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="glass-card flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 text-indigo-400 text-sm font-semibold tracking-wider uppercase mb-1">
                    <i class="fa-solid fa-chart-line"></i> HERO Stand-Alone Interactive Chart
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Trend Prezzi Alimentari WFP — Afghanistan (AFG)</h1>
                <p class="text-slate-400 text-sm mt-1">Indice dei prezzi alimentari WFP</p>
            </div>
        </header>

        <div class="glass-card">
            <div id="chart-container" style="min-height: 400px;"></div>
        </div>
        
        
    </div>

    <script>
        const series = [{"name": "Indice Prezzi WFP", "data": [0.9333333333333333, 1.0044117647058826, 1.0034375, 1.018578431372549, 1.01375, 1.027450980392157, 1.0236470588235294, 1.0036764705882353, 1.0241666666666667, 1.0263725490196076, 1.0190882352941177, 1.041519607843137, 1.0821568627450981, 1.0882352941176467, 1.0993235294117647, 1.1159313725490196, 1.1710294117647055, 1.1772058823529412, 1.1788235294117648, 1.1494117647058826, 1.156495098039216, 1.145441176470588, 1.1075, 1.1072058823529414, 1.1192401960784313, 1.1186764705882355, 1.1108529411764705, 1.096470588235294, 1.0983088235294118, null, null, null]}];
        const categories = ["2017-05-01", "2017-08-01", "2017-11-01", "2018-08-01", "2018-11-01", "2019-08-01", "2019-11-01", "2020-04-01", "2020-06-01", "2020-08-01", "2020-11-01", "2021-03-01", "2021-06-01", "2021-09-01", "2021-11-01", "2022-03-01", "2022-06-01", "2022-09-01", "2022-11-01", "2023-04-01", "2023-05-01", "2023-10-01", "2023-11-01", "2024-03-01", "2024-05-01", "2024-09-01", "2024-11-01", "2025-03-01", "2025-05-01", "2025-09-01", "2025-11-01", "2026-04-01"];
        const colors = ["#ec4899"];
        
        const options = {
            series: series,
            chart: {
                type: 'line',
                height: 450,
                toolbar: { show: true },
                background: 'transparent'
            },
            colors: colors,
            stroke: {
                width: 3,
                curve: 'smooth'
            },
            fill: {
                type: 'solid',
                opacity: 1,
                gradient: {
                    shade: 'dark',
                    type: 'diagonal1',
                    shadeIntensity: 0.5,
                    opacityFrom: 0.45,
                    opacityTo: 0.05,
                    stops: [0, 100]
                }
            },
            markers: {
                size: 3,
                hover: { size: 6 }
            },
            xaxis: {
                categories: categories,
                labels: {
                    style: {
                        colors: '#94a3b8',
                        fontSize: '11px',
                        fontFamily: 'Inter',
                        fontWeight: 500
                    }
                }
            },
            yaxis: {
                title: { text: 'Indice', style: { color: '#94a3b8' } },
                labels: {
                    style: { colors: '#64748b' }
                }
            },
            theme: { mode: 'dark' },
            tooltip: { shared: true, intersect: false },
            legend: { position: 'bottom', fontFamily: 'Inter', fontSize: '12px' }
        };
        
        const chart = new ApexCharts(document.querySelector("#chart-container"), options);
        chart.render();
    </script>
</body>
</html>
