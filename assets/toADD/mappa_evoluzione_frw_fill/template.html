<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO v4 — Evoluzione Geografica Spazio-Temporale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/svgmap@v2.21.0/dist/svg-map.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #22d3ee;
            --accent-purple: #818cf8;
            --accent-yellow: #fcd34d;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden !important; font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
        }

        #temporal-map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .svgMap-map-wrapper { background: transparent !important; }
        .svgMap-country { stroke: rgba(255, 255, 255, 0.15) !important; stroke-width: 0.5 !important; transition: fill 0.35s ease, stroke 0.2s ease !important; }
        .svgMap-country:hover { stroke: #ffffff !important; stroke-width: 1.2 !important; filter: brightness(1.2); }

        .floating-ui {
            position: absolute; z-index: 10; background: var(--bg-panel);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .ui-top-left { top: 20px; left: 20px; padding: 15px; min-width: 320px; }
        .header-brand { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .brand-text h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
        .brand-text p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }

        .custom-dropdown { position: relative; }
        .dropdown-toggle { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--accent-purple); color: var(--text-main); padding: 10px 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; }
        .dropdown-toggle:hover { background: rgba(255, 255, 255, 0.1); }
        .dropdown-content { display: none; position: absolute; top: 100%; left: 0; width: 100%; margin-top: 8px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; flex-direction: column; }
        .custom-dropdown:hover .dropdown-content { display: flex; }
        .tab-btn { background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-muted); padding: 12px 15px; text-align: left; cursor: pointer; font-family: inherit; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .tab-btn:hover, .tab-btn.active { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }

        .ui-bottom-center { bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 900px; padding: 15px 25px; display: flex; align-items: center; gap: 20px; }
        .play-btn { background: var(--accent-purple); border: none; border-radius: 10px; width: 45px; height: 45px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: background 0.2s; }
        .play-btn:hover { background: #6366f1; }
        .play-btn.playing { background: #ef4444; }
        .timeline-wrapper { flex: 1; display: flex; flex-direction: column; }
        .timeline-track-container { display: flex; align-items: center; gap: 15px; }
        .time-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .slider { flex: 1; appearance: none; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
        .slider::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text-main); cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .period-box { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 8px; text-align: center; min-width: 100px; }
        .period-box .pb-title { display: block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .period-box .pb-value { display: block; font-size: 1.2rem; font-weight: 800; color: var(--accent-yellow); }
        .speed-control { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
        .speed-control option { background: var(--bg-dark); }
        
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 1rem; transition: opacity 0.4s ease; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    
    <script>
        // Lo script Python inserirà i dati del JSON esattamente qui al posto del placeholder
        window.GLOBAL_SUMMARY_DATA = __JSON_DATA_PLACEHOLDER__; 
    </script>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-weight: 700; font-size: 1.1rem;">Caricamento Dati Spazio-Temporali HERO...</div>
    </div>

    <div id="temporal-map"></div>

    <div class="floating-ui ui-top-left">
        <div class="header-brand">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="brand-text">
                <h1>HERO v4</h1>
                <p>Evoluzione Geografica Interattiva</p>
            </div>
        </div>
        
        <div class="custom-dropdown">
            <button class="dropdown-toggle" id="current-dataset-btn">
                <i class="fa-solid fa-wheat-awn" style="color: #f59e0b;"></i> Sicurezza Alimentare (IPC 3+)
                <i class="fa-solid fa-chevron-down" style="margin-left: auto;"></i>
            </button>
            <div class="dropdown-content">
                <button class="tab-btn active" data-dataset="ipc"><i class="fa-solid fa-wheat-awn" style="color: #f59e0b;"></i> Sicurezza Alimentare (IPC 3+)</button>
                <button class="tab-btn" data-dataset="acled"><i class="fa-solid fa-person-rifle" style="color: #ef4444;"></i> Conflitti (ACLED)</button>
                <button class="tab-btn" data-dataset="idp"><i class="fa-solid fa-person-walking-dashed-line-arrow-right" style="color: #fbbf24;"></i> Sfollati Interni (IDP)</button>
                <button class="tab-btn" data-dataset="rainfall"><i class="fa-solid fa-cloud-showers-heavy" style="color: #3b82f6;"></i> Precipitazioni (CHIRPS)</button>
                <button class="tab-btn" data-dataset="wfp"><i class="fa-solid fa-money-bill-trend-up" style="color: #818cf8;"></i> Indice Prezzi (WFP)</button>
                <button class="tab-btn" data-dataset="ndvi"><i class="fa-solid fa-leaf" style="color: #10b981;"></i> Indice NDVI (VIM)</button>
                <button class="tab-btn" data-dataset="gdelt"><i class="fa-solid fa-globe" style="color: #a855f7;"></i> Instabilità (GDELT)</button>
            </div>
        </div>
    </div>

    <div class="floating-ui ui-bottom-center">
        <button class="play-btn" id="playBtn" title="Avvia/Pausa Riproduzione"><i class="fa-solid fa-play"></i></button>

        <div class="timeline-wrapper">
            <div class="timeline-track-container">
                <span class="time-label" id="labelStart">2017Q1</span>
                <input type="range" class="slider" id="timeSlider" min="0" max="100" value="0">
                <span class="time-label" id="labelEnd">2026Q2</span>
            </div>
        </div>

        <div class="period-box">
            <span class="pb-title">Periodo di Analisi</span>
            <span class="pb-value" id="currentDateVal">---</span>
        </div>

        <select class="speed-control" id="speedSelect" title="Velocità di Riproduzione">
            <option value="1500">0.5x (Lento)</option>
            <option value="800" selected>1.0x (Normale)</option>
            <option value="400">2.0x (Veloce)</option>
            <option value="150">5.0x (Ultra)</option>
        </select>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/svgmap@v2.21.0/dist/svg-map.umd.min.js"></script>

    <script>
        const ISO3_TO_ISO2 = {
            "AFG": "AF", "AGO": "AO", "BDI": "BI", "BEN": "BJ", "BFA": "BF", "BGD": "BD",
            "CAF": "CF", "CIV": "CI", "CMR": "CM", "COD": "CD", "CPV": "CV", "DJI": "DJ",
            "DOM": "DO", "ECU": "EC", "ETH": "ET", "GHA": "GH", "GIN": "GN", "GMB": "GM",
            "GNB": "GW", "GTM": "GT", "HND": "HN", "HTI": "HT", "KEN": "KE", "LBN": "LB",
            "LBR": "LR", "LSO": "LS", "MDG": "MG", "MLI": "ML", "MOZ": "MZ", "MRT": "MR",
            "MWI": "MW", "NAM": "NA", "NER": "NE", "NGA": "NG", "PAK": "PK", "PSE": "PS",
            "SDN": "SD", "SEN": "SN", "SLE": "SL", "SLV": "SV", "SOM": "SO", "SSD": "SS",
            "SWZ": "SZ", "TCD": "TD", "TGO": "TG", "TLS": "TL", "TZA": "TZ", "UGA": "UG",
            "YEM": "YE", "ZAF": "ZA", "ZMB": "ZM", "ZWE": "ZW"
        };

        let globalData = null;
        let currentDataset = 'ipc';
        let isForwardFill = true; 
        let currentTimeIndex = 0;
        let isPlaying = false;
        let playInterval = null;
        let mapInstance = null;
        let lastRenderedTheme = null;

        // Soglie massime standard per evitare colori sballati a 100% per dati grezzi
        const DATASET_CONFIGS = {
            ipc: { name: "IPC Fase 3+", format: "{0}%", colorMax: "#ef4444", maxVal: 100 },
            acled: { name: "Conflitti", format: "{0}", colorMax: "#f43f5e", maxVal: 100 },
            idp: { name: "Sfollati", format: "{0}", colorMax: "#fbbf24", maxVal: 100 },
            rainfall: { name: "Pioggia", format: "{0}mm", colorMax: "#3b82f6", maxVal: 100 },
            wfp: { name: "Indice WFP", format: "{0}", colorMax: "#818cf8", maxVal: 100 },
            ndvi: { name: "NDVI", format: "{0}", colorMax: "#10b981", maxVal: 100 },
            gdelt: { name: "Instabilità", format: "{0}", colorMax: "#a855f7", maxVal: 100 }
        };

        function interpolateColor(color1, color2, factor) {
            const hex = (c) => parseInt(c, 16);
            const r1 = hex(color1.substring(1, 3)), g1 = hex(color1.substring(3, 5)), b1 = hex(color1.substring(5, 7));
            const r2 = hex(color2.substring(1, 3)), g2 = hex(color2.substring(3, 5)), b2 = hex(color2.substring(5, 7));
            const r = Math.round(r1 + factor * (r2 - r1));
            const g = Math.round(g1 + factor * (g2 - g1));
            const b = Math.round(b1 + factor * (b2 - b1));
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
        }

        function init() {
            try {
                if (!window.GLOBAL_SUMMARY_DATA || Object.keys(window.GLOBAL_SUMMARY_DATA).length === 0) {
                    throw new Error("Dati non trovati. Esegui lo script Python per compilare l'HTML.");
                }
                
                globalData = window.GLOBAL_SUMMARY_DATA;
                
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 400);

                setupEvents();
                updateTimelineBounds();
                render();
            } catch (err) {
                console.error("Errore inizializzazione:", err);
                document.getElementById('loadingOverlay').innerHTML = `
                    <div style="color: #ef4444; font-size: 2rem;"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <div style="font-weight: 700; font-size: 1.2rem; margin-top: 15px; color: #f8fafc;">Errore nel Caricamento</div>
                    <div style="font-size: 0.85rem; color: #94a3b8; max-width: 400px; text-align: center; margin-top: 5px;">${err.message}</div>
                `;
            }
        }

        function setupEvents() {
            const dropdownToggle = document.getElementById('current-dataset-btn');
            const tabBtns = document.querySelectorAll('.tab-btn');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const iconHtml = btn.querySelector('i').outerHTML;
                    dropdownToggle.innerHTML = `${iconHtml} ${btn.textContent.trim()} <i class="fa-solid fa-chevron-down" style="margin-left: auto;"></i>`;
                    currentDataset = btn.getAttribute('data-dataset');
                    updateTimelineBounds();
                    render(true);
                });
            });

            document.getElementById('timeSlider').addEventListener('input', (e) => {
                currentTimeIndex = parseInt(e.target.value, 10);
                render();
            });

            document.getElementById('playBtn').addEventListener('click', togglePlay);
            document.getElementById('speedSelect').addEventListener('change', () => {
                if (isPlaying) {
                    clearInterval(playInterval);
                    startPlayLoop();
                }
            });
        }

        function togglePlay() {
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                isPlaying = false;
                clearInterval(playInterval);
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                btn.classList.remove('playing');
            } else {
                isPlaying = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                btn.classList.add('playing');
                startPlayLoop();
            }
        }

        function startPlayLoop() {
            const speed = parseInt(document.getElementById('speedSelect').value, 10) || 800;
            // Cerca il nodo che contiene i dati delle heatmap (valuta sia value_heatmaps che heatmaps.adm1)
            const heatmapsNode = globalData.value_heatmaps || globalData.heatmaps_data || globalData.heatmaps.adm1;
            const heatmapData = heatmapsNode[currentDataset];
            const maxIdx = heatmapData ? heatmapData.x.length - 1 : 0;

            playInterval = setInterval(() => {
                currentTimeIndex = (currentTimeIndex >= maxIdx) ? 0 : currentTimeIndex + 1;
                document.getElementById('timeSlider').value = currentTimeIndex;
                render();
            }, speed);
        }

        function updateTimelineBounds() {
            const heatmapsNode = globalData.value_heatmaps || globalData.heatmaps_data || globalData.heatmaps.adm1;
            const heatmapData = heatmapsNode[currentDataset];
            if (!heatmapData || !heatmapData.x) return;
            
            const slider = document.getElementById('timeSlider');
            slider.max = heatmapData.x.length - 1;
            if (currentTimeIndex >= heatmapData.x.length) {
                currentTimeIndex = heatmapData.x.length - 1;
            }
            slider.value = currentTimeIndex;

            document.getElementById('labelStart').textContent = heatmapData.x[0] || '';
            document.getElementById('labelEnd').textContent = heatmapData.x[heatmapData.x.length - 1] || '';
        }

        function render(forceRecreateMap = false) {
            if (!globalData) return;
            const heatmapsNode = globalData.value_heatmaps || globalData.heatmaps_data || globalData.heatmaps.adm1;
            const heatmapData = heatmapsNode[currentDataset];
            if (!heatmapData) return;

            const cfg = DATASET_CONFIGS[currentDataset];
            const dateStr = heatmapData.x[currentTimeIndex] || '---';
            document.getElementById('currentDateVal').textContent = dateStr;

            const currentValues = {}; 
            const rawValues = {};     

            heatmapData.y_codes.forEach((iso3, cIdx) => {
                const rawVal = heatmapData.z[cIdx][currentTimeIndex];
                if (rawVal !== null && rawVal !== undefined && !isNaN(rawVal)) {
                    rawValues[iso3] = rawVal;
                }

                if (isForwardFill) {
                    let valToUse = null;
                    for (let t = currentTimeIndex; t >= 0; t--) {
                        const v = heatmapData.z[cIdx][t];
                        if (v !== null && v !== undefined && !isNaN(v)) {
                            valToUse = v;
                            break;
                        }
                    }
                    if (valToUse !== null) {
                        currentValues[iso3] = valToUse;
                    }
                }
            });

            const mapValues = {};
            for (let iso3 in currentValues) {
                const iso2 = ISO3_TO_ISO2[iso3];
                if (iso2) {
                    mapValues[iso2] = { val: parseFloat(currentValues[iso3].toFixed(2)) };
                }
            }

            const container = document.getElementById('temporal-map');

            if (!forceRecreateMap && mapInstance && lastRenderedTheme === currentDataset) {
                for (let iso2 in mapInstance.options.data.values) {
                    mapInstance.options.data.values[iso2] = undefined;
                }
                container.querySelectorAll('.svgMap-country').forEach(p => p.style.fill = '#090d16');

                for (let iso3 in currentValues) {
                    const iso2 = ISO3_TO_ISO2[iso3];
                    if (iso2) {
                        const val = currentValues[iso3];
                        mapInstance.options.data.values[iso2] = { val: parseFloat(val.toFixed(2)) };
                        const factor = cfg.maxVal ? Math.min(Math.max(val / cfg.maxVal, 0), 1) : 0;
                        const color = interpolateColor('#1e293b', cfg.colorMax, factor);
                        const path = container.querySelector(`.svgMap-country-${iso2}`) || container.querySelector(`.svgMap-country[data-id="${iso2}"]`);
                        if (path) path.style.fill = color;
                    }
                }
                return;
            }

            document.querySelectorAll('.svgMap-tooltip').forEach(el => el.remove());
            container.innerHTML = "";
            lastRenderedTheme = currentDataset;

            mapInstance = new svgMap({
                targetElementID: 'temporal-map',
                showTooltips: true,
                data: {
                    data: {
                        val: {
                            name: cfg.name,
                            format: cfg.format,
                            thresholdMax: cfg.maxVal,
                            thresholdMin: 0
                        }
                    },
                    applyData: 'val',
                    values: mapValues
                },
                colorMin: '#1e293b',
                colorMax: cfg.colorMax,
                colorNoData: '#090d16'
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
