<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="africaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(40, 20)">
    <!-- Africa Continent Base Outline with Puzzle Cutout Slot -->
    <path d="M 210,40 
             C 270,30 330,60 350,90 
             C 370,120 390,140 370,170 
             C 350,195 365,225 385,250 
             C 395,265 375,295 345,310 
             C 325,320 310,350 295,380 
             C 280,410 260,435 240,445 
             C 230,450 220,430 215,400 
             C 210,370 195,340 180,310 
             C 170,290 150,270 140,240 
             C 130,210 100,180 85,150 
             C 70,120 90,80 120,60 
             C 150,45 180,50 210,40 Z" 
          fill="url(#africaGradient)" 
          stroke="#a5b4fc" 
          stroke-width="3" 
          filter="url(#glow)" />
          
    <!-- Grid Puzzle Interlocking Lines inside Africa -->
    <!-- Horizontal Puzzle Seam 1 -->
    <path d="M 100,140 C 130,140 140,125 150,140 C 160,155 170,140 230,140 C 270,140 280,125 290,140 C 300,155 310,140 365,140" 
          fill="none" stroke="rgba(15, 23, 42, 0.6)" stroke-width="2.5" stroke-dasharray="4,2" />
    
    <!-- Horizontal Puzzle Seam 2 -->
    <path d="M 145,240 C 185,240 195,225 205,240 C 215,255 225,240 285,240 C 315,240 325,225 335,240 C 345,255 355,240 380,240" 
          fill="none" stroke="rgba(15, 23, 42, 0.6)" stroke-width="2.5" stroke-dasharray="4,2" />

    <!-- Vertical Puzzle Seam 1 -->
    <path d="M 210,45 C 210,100 195,110 210,120 C 225,130 210,140 210,230 C 210,270 195,280 210,290 C 225,300 210,310 210,430" 
          fill="none" stroke="rgba(15, 23, 42, 0.6)" stroke-width="2.5" stroke-dasharray="4,2" />

    <!-- Puzzle Cutout Hole (Missing Piece in Central-East Africa) -->
    <path d="M 250,220 
             C 262,220 262,210 270,210 
             C 278,210 278,220 290,220 
             C 290,232 300,232 300,240 
             C 300,248 290,248 290,260 
             C 278,260 278,270 270,270 
             C 262,270 262,260 250,260 
             C 250,248 240,248 240,240 
             C 240,232 250,232 250,220 Z" 
          fill="#0b0f19" 
          stroke="#38bdf8" 
          stroke-width="2" />

    <!-- Floating Detached Puzzle Piece (The Missing Piece) -->
    <g transform="translate(320, 270) scale(0.75)">
      <path d="M 50,20 
               C 62,20 62,10 70,10 
               C 78,10 78,20 90,20 
               C 90,32 100,32 100,40 
               C 100,48 90,48 90,60 
               C 78,60 78,70 70,70 
               C 62,70 62,60 50,60 
               C 50,48 40,48 40,40 
               C 40,32 50,32 50,20 Z" 
            fill="#38bdf8" 
            stroke="#f0f9ff" 
            stroke-width="2" 
            filter="url(#glow)" />
      
      <!-- Arrow pointing missing piece into Africa slot -->
      <path d="M -15,10 Q -5,15 5,30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,2" marker-end="url(#arrow)" />
    </g>
  </g>
</svg>
